{% extends "base.html" %}
{% block title %}{{ 'Изменить студента' if student else 'Новый студент' }}{% endblock %}
{% block content %}
<h1>{{ 'Изменить студента' if student else 'Новый студент' }}</h1>
<form class="card" method="post">
  <label>Фамилия <input name="last_name" required maxlength="50" value="{{ student.last_name if student }}"></label>
  <label>Имя <input name="first_name" required maxlength="50" value="{{ student.first_name if student }}"></label>
  <label>Отчество <input name="patronymic" maxlength="50" value="{{ (student.patronymic or '') if student }}"></label>
  <label>Год поступления <input name="admission_year" type="number" required min="1990" max="2100" value="{{ student.admission_year if student }}"></label>
  <label>Форма обучения
    <select name="study_form">
      {% for f in study_forms %}
        <option value="{{ f }}" {{ 'selected' if student and student.study_form == f }}>{{ f }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Группа <input name="group_name" required maxlength="20" value="{{ student.group_name if student }}"></label>
  <p><button type="submit">{{ 'Сохранить изменения' if student else 'Добавить студента' }}</button>
     <a href="{{ url_for('dean.students') }}">Отмена</a></p>
</form>
{% endblock %}
